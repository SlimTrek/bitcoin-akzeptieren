<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img">
  <title>Lightning als Layer 2</title>
  <desc>Layer 1 Bitcoin Blockchain fuer Sicherheit; Layer 2 Lightning fuer schnelle Alltagszahlungen im Kanal.</desc>
  <rect x="0" y="0" width="640" height="220" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="24" y="20" width="592" height="100" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="40" y="44" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LAYER 2 - LIGHTNING</text>
  <text x="40" y="70" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Zahlungskanal (off-chain)</text>
  <text x="40" y="94" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Tausende Transaktionen - Millisekunden - sehr geringe Gebuehren</text>
  <circle cx="420" cy="70" r="8" fill="#f7931a"/>
  <circle cx="540" cy="70" r="8" fill="#f7931a"/>
  <path d="M428 70 H532" stroke="#f7931a" stroke-width="2" fill="none"/>
  <text x="455" y="62" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Kanal</text>
  <path d="M320 120 V142" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <rect x="24" y="148" width="592" height="58" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="40" y="172" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LAYER 1 - BITCOIN</text>
  <text x="40" y="194" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Blockchain - Kanal oeffnen / schliessen - maximale Sicherheit</text>
</svg>
