<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Backup-Stufen</title>
  <desc id="desc">Drei Stufen: Papier für kleine Beträge, Stahl für Vermögen, optional Passphrase als zusätzlicher Schutz.</desc>
  <style>
    .box { fill: #0e0e0e; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    .box-hot { fill: rgba(247,147,26,0.12); stroke: rgba(247,147,26,0.45); stroke-width: 1.5; }
    .lbl { fill: #f4f4f5; font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; font-weight: 700; }
    .sub { fill: #a1a1aa; font-family: "DM Sans", system-ui, sans-serif; font-size: 12px; }
    .n { fill: #f7931a; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 700; }
    .arr { fill: #f7931a; font-size: 18px; font-family: "DM Sans", system-ui, sans-serif; }
  </style>
  <rect class="box" x="16" y="40" width="180" height="120" rx="12"/>
  <text class="n" x="32" y="68">LEVEL 1</text>
  <text class="lbl" x="32" y="98">Papier</text>
  <text class="sub" x="32" y="120">Einstieg · kleine Beträge</text>
  <text class="sub" x="32" y="138">Kugelschreiber · Reihenfolge</text>

  <text class="arr" x="208" y="110">’</text>

  <rect class="box-hot" x="230" y="40" width="180" height="120" rx="12"/>
  <text class="n" x="246" y="68">LEVEL 2</text>
  <text class="lbl" x="246" y="98">Stahl</text>
  <text class="sub" x="246" y="120">Feuer · Wasser · Druck</text>
  <text class="sub" x="246" y="138">4 Buchstaben / BIP39</text>

  <text class="arr" x="422" y="110">’</text>

  <rect class="box" x="444" y="40" width="180" height="120" rx="12"/>
  <text class="n" x="460" y="68">LEVEL 3</text>
  <text class="lbl" x="460" y="98">+ Passphrase</text>
  <text class="sub" x="460" y="120">25. Wort separat</text>
  <text class="sub" x="460" y="138">nie mit Seed lagern</text>
</svg>
