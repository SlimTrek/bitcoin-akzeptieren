<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Boersenrisiko</title>
  <desc>Custodial Boerse als Gegenpartei versus Self-Custody mit eigenen Keys.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="36" width="280" height="128" rx="12" fill="#1c1c1e" stroke="#71717a" stroke-width="1.5"/>
  <text x="36" y="66" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12" font-weight="700">CUSTODIAL</text>
  <text x="36" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Boerse haelt Keys</text>
  <text x="36" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Hack / Insolvenz / Freeze</text>
  <text x="36" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Du hast ein IOU</text>
  <path d="M320 100 H352" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="352,94 366,100 352,106" fill="#f7931a"/>
  <rect x="380" y="36" width="240" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="396" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SELF-CUSTODY</text>
  <text x="396" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Du haeltst Keys</text>
  <text x="396" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Abheben + Backup</text>
  <text x="396" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Gegenpartei weg</text>
</svg>
