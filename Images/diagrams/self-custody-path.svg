<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Self-Custody Pfad</title>
  <desc>Von der Boerse ueber die Hardware Wallet zum getrennten Seed-Backup.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="40" width="160" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="34" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">01</text>
  <text x="34" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Boerse</text>
  <text x="34" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Custodial - KYC</text>
  <text x="34" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">not your keys</text>
  <path d="M192 100 H224" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="224,94 238,100 224,106" fill="#f7931a"/>
  <rect x="250" y="40" width="180" height="120" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="264" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">02</text>
  <text x="264" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Hardware Wallet</text>
  <text x="264" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Keys bleiben on-device</text>
  <text x="264" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Signatur am Geraet</text>
  <path d="M442 100 H474" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="474,94 488,100 474,106" fill="#f7931a"/>
  <rect x="500" y="40" width="120" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="514" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">03</text>
  <text x="514" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Seed</text>
  <text x="514" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Backup getrennt</text>
  <text x="514" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Papier / Stahl</text>
</svg>
