<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Backup-Stufen</title>
  <desc>Drei Stufen: Papier, Stahl, optional Passphrase.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="18" y="36" width="180" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="32" y="62" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LEVEL 1</text>
  <text x="32" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Papier</text>
  <text x="32" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Einstieg - kleine Betraege</text>
  <text x="32" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Kugelschreiber - Reihenfolge</text>
  <text x="210" y="108" fill="#f7931a" font-family="system-ui,sans-serif" font-size="22" font-weight="700">-&gt;</text>
  <rect x="240" y="36" width="180" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="254" y="62" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LEVEL 2</text>
  <text x="254" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Stahl</text>
  <text x="254" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Feuer - Wasser - Druck</text>
  <text x="254" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">4 Buchstaben / BIP39</text>
  <text x="432" y="108" fill="#f7931a" font-family="system-ui,sans-serif" font-size="22" font-weight="700">-&gt;</text>
  <rect x="462" y="36" width="160" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="476" y="62" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LEVEL 3</text>
  <text x="476" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="16" font-weight="700">+ Passphrase</text>
  <text x="476" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">25. Wort separat</text>
  <text x="476" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">nie mit Seed lagern</text>
</svg>
