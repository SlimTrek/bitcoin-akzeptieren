<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Bitcoin und Vorsorge CH</title>
  <desc>Orientierung: Saeulen vs. Self-Custody Bitcoin - keine Beratung.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="36" width="190" height="128" rx="12" fill="#1c1c1e" stroke="#71717a" stroke-width="1.5"/>
  <text x="36" y="66" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SAEULE 1-3</text>
  <text x="36" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Vorsorgesystem</text>
  <text x="36" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">AHV / PK / 3a</text>
  <text x="36" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Regeln + Steuer</text>
  <rect x="225" y="36" width="190" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="241" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SELF-CUSTODY</text>
  <text x="241" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Bitcoin privat</text>
  <text x="241" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Keys = Verantwortung</text>
  <text x="241" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Vermogenssteuer</text>
  <rect x="430" y="36" width="190" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="446" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ORIENTIERUNG</text>
  <text x="446" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Nicht ersetzen</text>
  <text x="446" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Rollen klaeren</text>
  <text x="446" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Keine Beratung</text>
</svg>
