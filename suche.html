    <style>
        .search-page {
            max-width: 720px;
            margin: 0 auto;
            padding: calc(var(--nav-h) + 48px) 20px 80px;
        }
        .search-page h1 {
            margin: 0 0 8px;
            font-size: clamp(1.75rem, 4vw, 2.4rem);
        }
        .search-page .lede {
            color: var(--text-muted);
            margin: 0 0 28px;
        }
        #search-page-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        #search-page-input {
            flex: 1 1 240px;
            min-width: 0;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--brand-border);
            background: var(--bg-elevated);
            color: var(--text);
            font-size: 1.05rem;
            font-family: var(--font-body);
        }
        #search-page-input:focus {
            outline: 2px solid var(--brand);
            outline-offset: 1px;
        }
        #search-page-form button {
            padding: 14px 22px;
            border: 0;
            border-radius: var(--radius-pill);
            background: var(--brand);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: var(--font-body);
        }
        #search-page-form button:hover { background: var(--brand-hover); }
        #search-page-meta {
            color: var(--text-faint);
            font-size: 0.9rem;
            margin: 0 0 24px;
            min-height: 1.3em;
        }
        #search-page-results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-page-card {
            display: block;
            padding: 18px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: inherit !important;
            text-decoration: none !important;
            transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
        }
        .search-page-card:hover {
            border-color: var(--brand-border);
            background: var(--bg-card-hover);
        }
        .search-page-card h2 {
            margin: 6px 0 8px;
            font-size: 1.15rem;
            color: var(--text);
        }
        .search-page-card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .search-hints {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .search-hints a { font-weight: 600; }
    </style>

        <form id="search-page-form" role="search" action="/suche.html" method="get">

            <button type="submit">Suchen</button>
        </form>
        <p id="search-page-meta" aria-live="polite"></p>
