<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">Lightning als Layer 2</title>
  <desc id="desc">Layer 1 Bitcoin Blockchain für Sicherheit; Layer 2 Lightning für schnelle Alltagszahlungen im Kanal.</desc>
  <style>
    .box { fill: #0e0e0e; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    .box-l2 { fill: rgba(247,147,26,0.1); stroke: rgba(247,147,26,0.45); stroke-width: 1.5; }
    .lbl { fill: #f4f4f5; font-family: "DM Sans", system-ui, sans-serif; font-size: 14px; font-weight: 700; }
    .sub { fill: #a1a1aa; font-family: "DM Sans", system-ui, sans-serif; font-size: 11.5px; }
    .tag { fill: #f7931a; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 700; }
    .line { stroke: #f7931a; stroke-width: 2; fill: none; }
    .node { fill: #f7931a; }
    .dim { stroke: rgba(255,255,255,0.2); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  </style>
  <!-- Layer 2 -->
  <rect class="box-l2" x="24" y="20" width="592" height="100" rx="14"/>
  <text class="tag" x="40" y="44">LAYER 2 · LIGHTNING</text>
  <text class="lbl" x="40" y="68">Zahlungskanal (off-chain)</text>
  <text class="sub" x="40" y="88">Tausende Transaktionen · Millisekunden · sehr geringe Gebühren</text>
  <!-- two peers -->
  <circle class="node" cx="420" cy="70" r="8"/>
  <circle class="node" cx="540" cy="70" r="8"/>
  <path class="line" d="M428 70 H532"/>
  <text class="sub" x="455" y="62">Kanal</text>
  <!-- dashed down -->
  <path class="dim" d="M320 120 V142"/>
  <!-- Layer 1 -->
  <rect class="box" x="24" y="142" width="592" height="62" rx="14"/>
  <text class="tag" x="40" y="166">LAYER 1 · BITCOIN</text>
  <text class="lbl" x="40" y="188">Blockchain · Kanal öffnen / schliessen · maximale Sicherheit</text>
</svg>
