<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Lightning an der Kasse</title>
  <desc id="desc">Kunde zahlt per Lightning-App, Haendler bestaetigt, Sats halten oder in CHF wechseln.</desc>
  <!-- Inline fills (no CSS classes): better contrast as &lt;img&gt; -->
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="24" y="44" width="150" height="112" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="36" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">01</text>
  <text x="36" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Kunde</text>
  <text x="36" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Lightning-Wallet</text>
  <text x="36" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">QR scannen / Zap</text>
  <path d="M186 100 H218" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="218,94 232,100 218,106" fill="#f7931a"/>
  <rect x="244" y="44" width="168" height="112" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="258" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">02</text>
  <text x="258" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Kasse / App</text>
  <text x="258" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Rechnung erzeugen</text>
  <text x="258" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Bestaetigung unter 1 s</text>
  <path d="M424 100 H456" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="456,94 470,100 456,106" fill="#f7931a"/>
  <rect x="482" y="44" width="134" height="112" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="496" y="68" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">03</text>
  <text x="496" y="98" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Haendler</text>
  <text x="496" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Sats und/oder</text>
  <text x="496" y="140" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">auto CHF</text>
</svg>
