<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Letter of Instruction</title>
  <desc>Was Angehoerige brauchen: Brief, Seed-Ort, Wallet-Hersteller, Kontakt.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="18" y="40" width="140" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="32" y="70" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">01</text>
  <text x="32" y="100" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Brief</text>
  <text x="32" y="122" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Klartext, kein Seed</text>
  <text x="32" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">im Brief selbst</text>
  <path d="M170 100 H196" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="196,94 210,100 196,106" fill="#f7931a"/>
  <rect x="222" y="40" width="140" height="120" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="236" y="70" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">02</text>
  <text x="236" y="100" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Ort</text>
  <text x="236" y="122" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Wo liegt Backup?</text>
  <text x="236" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Tresor / Bankfach</text>
  <path d="M374 100 H400" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="400,94 414,100 400,106" fill="#f7931a"/>
  <rect x="426" y="40" width="196" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="440" y="70" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">03</text>
  <text x="440" y="100" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Wiederherstellen</text>
  <text x="440" y="122" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Wallet-Marke + Schritte</text>
  <text x="440" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">optional: Mentor-Kontakt</text>
</svg>
