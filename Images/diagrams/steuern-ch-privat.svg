<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Bitcoin Steuern Schweiz privat</title>
  <desc>Privatvermoegen: oft steuerfreier Kapitalgewinn, Vermoegenssteuer, Risiko gewerbsmaessig.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="16" y="32" width="190" height="120" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="30" y="58" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">1 - GEWINN</text>
  <text x="30" y="90" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Kapitalgewinn</text>
  <text x="30" y="114" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Privatanleger oft</text>
  <text x="30" y="134" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">steuerfrei (Halten)</text>
  <rect x="222" y="32" width="190" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="236" y="58" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">2 - VERMOEGEN</text>
  <text x="236" y="90" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Vermoegenssteuer</text>
  <text x="236" y="114" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Bestand per 31.12.</text>
  <text x="236" y="134" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">ESTV-Kurs / Deklaration</text>
  <rect x="428" y="32" width="196" height="120" rx="12" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="442" y="58" fill="#ef4444" font-family="system-ui,sans-serif" font-size="12" font-weight="700">3 - ACHTUNG</text>
  <text x="442" y="90" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Gewerbsmaessig?</text>
  <text x="442" y="114" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Viel Trading / Leverage</text>
  <text x="442" y="134" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">andere Regeln</text>
  <text x="16" y="178" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Keine Steuerberatung - bei Unsicherheit Treuhaender / ESTV abklaeren.</text>
</svg>
