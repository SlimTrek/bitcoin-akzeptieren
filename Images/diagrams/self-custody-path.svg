<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Self-Custody Pfad</title>
  <desc id="desc">Von der Börse über die Hardware Wallet zum getrennten Seed-Backup.</desc>
  <style>
    .box { fill: #0e0e0e; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    .box-hot { fill: rgba(247,147,26,0.12); stroke: rgba(247,147,26,0.45); stroke-width: 1.5; }
    .lbl { fill: #f4f4f5; font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; font-weight: 700; }
    .sub { fill: #a1a1aa; font-family: "DM Sans", system-ui, sans-serif; font-size: 12px; }
    .arr { stroke: #f7931a; stroke-width: 2; fill: none; marker-end: url(#m); }
    .n { fill: #f7931a; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 700; }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f7931a"/>
    </marker>
  </defs>
  <!-- 1 Börse -->
  <rect class="box" x="16" y="48" width="150" height="104" rx="12"/>
  <text class="n" x="28" y="72">01</text>
  <text class="lbl" x="28" y="100">Börse</text>
  <text class="sub" x="28" y="122">Custodial · KYC</text>
  <text class="sub" x="28" y="138">not your keys</text>
  <!-- arrow -->
  <path class="arr" d="M178 100 H214"/>
  <!-- 2 HW -->
  <rect class="box-hot" x="226" y="48" width="168" height="104" rx="12"/>
  <text class="n" x="240" y="72">02</text>
  <text class="lbl" x="240" y="100">Hardware Wallet</text>
  <text class="sub" x="240" y="122">Keys bleiben on-device</text>
  <text class="sub" x="240" y="138">Signatur am Gerät</text>
  <!-- arrow -->
  <path class="arr" d="M406 100 H442"/>
  <!-- 3 Backup -->
  <rect class="box" x="454" y="48" width="170" height="104" rx="12"/>
  <text class="n" x="468" y="72">03</text>
  <text class="lbl" x="468" y="100">Seed-Backup</text>
  <text class="sub" x="468" y="122">Papier / Stahl</text>
  <text class="sub" x="468" y="138">getrennt vom Gerät</text>
</svg>
