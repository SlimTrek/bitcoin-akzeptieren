<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Lightning Liquiditaet</title>
  <desc>Outbound senden, Inbound empfangen, Routing dazwischen.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="36" width="180" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="36" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">OUTBOUND</text>
  <text x="36" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Senden</text>
  <text x="36" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Dein Anteil</text>
  <text x="36" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">im Kanal</text>
  <rect x="220" y="36" width="200" height="128" rx="12" fill="#1c1c1e" stroke="#71717a" stroke-width="1.5"/>
  <text x="236" y="66" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ROUTING</text>
  <text x="236" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Pfad finden</text>
  <text x="236" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Liquiditaet</text>
  <text x="236" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">entlang der Route</text>
  <rect x="440" y="36" width="180" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="456" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">INBOUND</text>
  <text x="456" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Empfangen</text>
  <text x="456" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Gegenseite</text>
  <text x="456" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">muss Platz haben</text>
</svg>
