<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Full Node vs fremder Server</title>
  <desc>Eigener Node validiert Regeln; fremde Server sehen Adressen und IP.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="18" y="36" width="280" height="120" rx="12" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.45)" stroke-width="1.5"/>
  <text x="32" y="62" fill="#f87171" font-family="system-ui,sans-serif" font-size="12" font-weight="700">OHNE NODE</text>
  <text x="32" y="92" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Wallet fragt Server</text>
  <text x="32" y="116" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">"Wie viel auf Adresse XY?"</text>
  <text x="32" y="136" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Server sieht Adresse + IP</text>
  <rect x="342" y="36" width="280" height="120" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="356" y="62" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">MIT FULL NODE</text>
  <text x="356" y="92" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Du validierst selbst</text>
  <text x="356" y="116" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Regeln + Blockchain lokal</text>
  <text x="356" y="136" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Privatsphaere bleibt bei dir</text>
  <text x="18" y="180" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Don't trust, verify - Goldstandard: BitBox + eigener Node.</text>
</svg>
