<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>UTXO Konsolidierung</title>
  <desc>Viele kleine Muenzen werden zu einer grossen Muenze konsolidiert.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="28" width="250" height="144" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="36" y="56" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">VORHER</text>
  <text x="36" y="84" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Viele kleine UTXOs</text>
  <text x="36" y="108" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">z.B. 52 Sparplan-Muenzen</text>
  <circle cx="56" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <circle cx="86" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <circle cx="116" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <circle cx="146" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <circle cx="176" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <circle cx="206" cy="148" r="11" fill="rgba(247,147,26,0.4)" stroke="#f7931a"/>
  <text x="228" y="152" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="14">...</text>
  <path d="M286 100 H320" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="320,94 334,100 320,106" fill="#f7931a"/>
  <text x="288" y="88" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">selbst senden</text>
  <rect x="348" y="28" width="270" height="144" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="364" y="56" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">NACHHER</text>
  <text x="364" y="84" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Eine grosse UTXO</text>
  <text x="364" y="108" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">weniger Bytes - guenstigere Spends</text>
  <circle cx="470" cy="148" r="22" fill="#f7931a"/>
</svg>
