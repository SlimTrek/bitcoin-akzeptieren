<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Kaufkraft und Inflation</title>
  <desc>Gleiche CHF-Summe kauft ueber Zeit weniger; knappe Geldmenge als Gegenmodell.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <text x="28" y="36" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Kaufkraft einer festen CHF-Summe (schematisch)</text>
  <rect x="40" y="56" width="40" height="110" rx="6" fill="rgba(247,147,26,0.55)"/>
  <text x="48" y="186" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Jahr 1</text>
  <rect x="120" y="76" width="40" height="90" rx="6" fill="rgba(247,147,26,0.4)"/>
  <text x="122" y="186" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Jahr 5</text>
  <rect x="200" y="96" width="40" height="70" rx="6" fill="rgba(247,147,26,0.28)"/>
  <text x="198" y="186" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Jahr 10</text>
  <rect x="280" y="116" width="40" height="50" rx="6" fill="rgba(247,147,26,0.18)"/>
  <text x="278" y="186" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="11">Jahr 20</text>
  <path d="M360 100 H400" stroke="#71717a" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <rect x="412" y="48" width="200" height="120" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="428" y="80" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">GEGENMODELL</text>
  <text x="428" y="110" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Feste Menge</text>
  <text x="428" y="134" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">21 Mio. Bitcoin</text>
  <text x="428" y="156" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">keine Druckmaschine</text>
</svg>
