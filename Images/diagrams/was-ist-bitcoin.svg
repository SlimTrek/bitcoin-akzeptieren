<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Was ist Bitcoin</title>
  <desc>Drei Eigenschaften: knappes Gut, dezentrales Netzwerk, selbst verwahrbar.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="20" y="36" width="190" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="36" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">01</text>
  <text x="36" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Knappheit</text>
  <text x="36" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Max. 21 Mio. BTC</text>
  <text x="36" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Regeln im Code</text>
  <rect x="225" y="36" width="190" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="241" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">02</text>
  <text x="241" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Netzwerk</text>
  <text x="241" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Nodes + Miner</text>
  <text x="241" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Kein Zentralrechner</text>
  <rect x="430" y="36" width="190" height="128" rx="12" fill="#1c1c1e" stroke="#71717a" stroke-width="1.5"/>
  <text x="446" y="66" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">03</text>
  <text x="446" y="96" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Selbst verwahren</text>
  <text x="446" y="120" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Keys = Besitz</text>
  <text x="446" y="142" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Ohne Bankkonto</text>
</svg>
