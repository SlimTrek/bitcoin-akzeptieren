<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Satoshi und Bitcoin</title>
  <desc>1 BTC entspricht 100 Millionen Satoshis.</desc>
  <rect x="0" y="0" width="640" height="200" rx="14" fill="#141414" stroke="#f7931a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="24" y="36" width="260" height="128" rx="12" fill="rgba(247,147,26,0.14)" stroke="#f7931a" stroke-width="2"/>
  <text x="40" y="70" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">1 BITCOIN</text>
  <text x="40" y="104" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="22" font-weight="700">1 BTC</text>
  <text x="40" y="136" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="13">ganze Einheit</text>
  <path d="M300 100 H340" stroke="#f7931a" stroke-width="2.5" fill="none"/>
  <polygon points="340,94 354,100 340,106" fill="#f7931a"/>
  <rect x="368" y="36" width="248" height="128" rx="12" fill="#1c1c1e" stroke="#f7931a" stroke-width="1.5"/>
  <text x="384" y="70" fill="#f7931a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">100'000'000</text>
  <text x="384" y="104" fill="#f4f4f5" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Sats</text>
  <text x="384" y="136" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="13">kleinste Einheit</text>
</svg>
